[project]
name = "aegis"
version = "0.1.0"
description = "Aegis: Verifiable Agent Infrastructure - Production infrastructure for long-running autonomous agents with verifiable execution"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jason Stiltner" }
]
requires-python = ">=3.11"
keywords = [
    "ai",
    "agents",
    "autonomous",
    "llm",
    "commitments",
    "verification",
    "constitutional-ai",
    "multi-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anyio>=4.0",
    
    # Database
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    
    # LLM Providers
    "anthropic>=0.40",
    "litellm>=1.0",
    "tiktoken>=0.5",
    
    # MCP Protocol
    "mcp>=1.0",
    
    # API
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    
    # CLI
    "typer>=0.9",
    "rich>=13.0",
    
    # Utilities
    "structlog>=24.0",
    "python-ulid>=2.0",
    "orjson>=3.9",
    "httpx>=0.26",
    "tenacity>=8.2",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.92",
    "mypy>=1.8",
    "ruff>=0.1",
    "pre-commit>=3.6",
]

local-models = [
    "transformers>=4.36",
    "torch>=2.1",
    "accelerate>=0.25",
]

gcl = [
    # GCL framework for grounded commitment learning
    # Install from local path: pip install -e ../gcl
    # Or from git: pip install git+https://github.com/yourusername/gcl.git
]

[project.scripts]
aegis = "aegis.cli.main:app"

[project.urls]
Homepage = "https://github.com/yourusername/aegis"
Documentation = "https://aegis.readthedocs.io"
Repository = "https://github.com/yourusername/aegis"
Issues = "https://github.com/yourusername/aegis/issues"
Changelog = "https://github.com/yourusername/aegis/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["aegis"]

[tool.coverage.run]
source = ["src/aegis"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
